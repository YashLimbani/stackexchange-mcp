[project]
name = "stackexchange-mcp"
version = "0.1.2"
description = "MCP server that lets AI assistants search Stack Overflow and other Stack Exchange sites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yash Limbani" }]
keywords = ["mcp", "model-context-protocol", "stackoverflow", "stackexchange", "ai", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
   "mcp>=1.10,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/YashLimbani/stackexchange-mcp" 
Issues = "https://github.com/YashLimbani/stackexchange-mcp/issues"

[project.scripts]
stackexchange-mcp = "stackexchange_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackexchange_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]